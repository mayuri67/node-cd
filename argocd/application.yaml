apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nodejs-app
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/mayuri67/node-repo.git
    targetRevision: main
    path: helm/nodejs-app

    helm:
      values: |
        image:
          repository: mayuri67/nodejs-app
          tag: latest

  destination:
    server: https://kubernetes.default.svc
    namespace: nodejs

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true